name: Alternator and solar charger
products:
  - id: ex0nj9l2thnxwmby
    manufacturer: Etaker
    model: F2000
entities:
  - entity: switch
    icon: mdi:power
    dps:
      - id: 127
        type: boolean
        name: switch
      - id: 130
        type: string
        name: model
      - id: 131
        type: string
        name: hardware_version
      - id: 132
        type: string
        name: software_version
  - entity: sensor
    class: temperature
    dps:
      - id: 128
        type: integer
        name: sensor
        unit: C
  - entity: sensor
    name: Fan speed
    icon: mdi:fan
    dps:
      - id: 129
        type: integer
        name: sensor
        unit: "%"
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 133
        type: string
        name: sensor
        mapping:
          - dps_val: "200"
            value: false
          - value: true
      - id: 133
        type: string
        name: fault_code
      - id: 133
        type: string
        name: description
        mapping:
          - dps_val: "200"
            value: ok
          - dps_val: "101"
            value: alternator_overvoltage
          - dps_val: "102"
            value: alternator_overcurrent
          - dps_val: "103"
            value: alternator_output_overcurrent
          - dps_val: "201"
            value: solar_overvoltage
          - dps_val: "202"
            value: solar_overcurrent
          - dps_val: "203"
            value: solar_output_overcurrent
          - dps_val: "301"
            value: output_overvoltage
          - dps_val: "302"
            value: output_overcurrent
          - dps_val: "303"
            value: output_overload
          - dps_val: "801"
            value: overheating
          - dps_val: "802"
            value: under_temperature
          - dps_val: "803"
            value: fan_malfunction

  # Alternator (Car Charging)
  - entity: switch
    name: Alternator charging
    icon: mdi:car-battery
    dps:
      - id: 101
        type: boolean
        name: switch

  - entity: select
    name: Alternator mode
    icon: mdi:cog
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: "ALT_CHG"
            value: "Alternator charge"
          - dps_val: "CHG_CAR_BAT"
            value: "Charge car battery"
          - dps_val: "ACT_CAR_BAT"
            value: "Activate car battery"

  - entity: number
    name: Alternator power limit
    icon: mdi:lightning-bolt
    dps:
      - id: 103
        type: integer
        name: value
        unit: W
        mapping:
          - step: 100
        range:
          min: 100
          max: 1000

  - entity: number
    name: Alternator current limit
    class: current
    dps:
      - id: 104
        type: integer
        name: value
        unit: A
        mapping:
          - step: 10
        range:
          min: 10
          max: 70

  - entity: sensor
    name: Alternator voltage
    class: voltage
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: Alternator power
    class: power
    dps:
      - id: 106
        type: integer
        name: sensor
        unit: W

  - entity: switch
    name: Alternator status check
    icon: mdi:check-circle
    category: config
    dps:
      - id: 134
        type: boolean
        name: switch

  - entity: number
    name: Charging start voltage
    class: voltage
    category: config
    dps:
      - id: 135
        type: integer
        name: value
        unit: V
        mapping:
          - scale: 10
            step: 1
        range:
          min: 125
          max: 280

  # PV (Solar)
  - entity: switch
    name: PV port
    icon: mdi:solar-panel
    dps:
      - id: 107
        type: boolean
        name: switch

  - entity: select
    name: PV mode
    icon: mdi:solar-power
    dps:
      - id: 108
        type: string
        name: option
        mapping:
          - dps_val: PV_CHG
            value: Solar charging
          - dps_val: DC_OUT
            value: DC output

  - entity: select
    name: PV output voltage
    icon: mdi:flash-outline
    dps:
      - id: 109
        type: string
        name: option
        mapping:
          - dps_val: 12V
            value: 12V
          - dps_val: 24V
            value: 24V
          - dps_val: 36V
            value: 36V
          - dps_val: 48V
            value: 48V

  - entity: number
    name: PV output current
    class: current
    dps:
      - id: 110
        type: integer
        name: value
        unit: A
        range:
          min: 5
          max: 20

  - entity: sensor
    name: PV voltage
    class: voltage
    dps:
      - id: 111
        type: integer
        name: sensor
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: PV power
    class: power
    dps:
      - id: 112
        type: integer
        name: sensor
        unit: W

  # Etaker proprietary port (connects to other Etaker products)
  - entity: switch
    name: Expansion port
    icon: mdi:connection
    dps:
      - id: 113
        type: boolean
        name: switch

  - entity: sensor
    name: Expansion port voltage
    class: voltage
    dps:
      - id: 114
        type: integer
        name: sensor
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: Expansion port power
    class: power
    dps:
      - id: 115
        type: integer
        name: sensor
        unit: W

  # DC Port
  - entity: switch
    name: DC port
    icon: mdi:power-plug
    dps:
      - id: 116
        type: boolean
        name: switch

  - entity: select
    name: DC mode
    icon: mdi:cog-transfer
    dps:
      - id: 117
        type: string
        name: option
        mapping:
          - dps_val: CHG_POWER
            value: Charge power station
          - dps_val: CHG_BAT
            value: Charge battery
          - dps_val: DC_OUT
            value: DC output

  - entity: select
    name: DC output voltage
    icon: mdi:flash-outline
    dps:
      - id: 118
        type: string
        name: option
        mapping:
          - dps_val: 12V
            value: 12V
          - dps_val: 24V
            value: 24V
          - dps_val: 36V
            value: 36V
          - dps_val: 48V
            value: 48V

  - entity: number
    name: DC output current limit
    class: current
    category: config
    dps:
      - id: 119
        type: integer
        name: value
        unit: A
        range:
          min: 5
          max: 40

  - entity: number
    name: DC charge voltage
    class: voltage
    category: config
    dps:
      - id: 120
        type: integer
        name: value
        unit: V
        mapping:
          - scale: 10
            step: 5
        range:
          min: 120
          max: 600

  - entity: number
    name: DC charge current
    class: current
    category: config
    dps:
      - id: 121
        type: integer
        name: value
        unit: A
        mapping:
          - scale: 10
            step: 10
        range:
          min: 30
          max: 600

  - entity: number
    name: DC precharge voltage
    class: voltage
    category: config
    dps:
      - id: 122
        type: integer
        name: value
        unit: V
        mapping:
          - scale: 10
            step: 5
        range:
          min: 120
          max: 600

  - entity: number
    name: DC precharge current
    class: current
    category: config
    dps:
      - id: 123
        type: integer
        name: value
        unit: A
        mapping:
          - scale: 10
            step: 5
        range:
          min: 5
          max: 100

  - entity: select
    name: DC source voltage
    icon: mdi:flash-outline
    category: config
    dps:
      - id: 124
        type: string
        name: option
        mapping:
          - dps_val: 24V
            value: 24V
          - dps_val: 48V
            value: 48V

  - entity: sensor
    name: DC voltage
    class: voltage
    dps:
      - id: 125
        type: integer
        name: sensor
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: DC power
    class: power
    dps:
      - id: 126
        type: integer
        name: sensor
        unit: W
