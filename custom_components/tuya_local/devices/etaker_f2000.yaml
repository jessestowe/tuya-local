name: Alternator and solar charger
products:
  - id: ex0nj9l2thnxwmby
    manufacturer: Etaker
    model: F2000
entities:
  - entity: switch
    icon: mdi:power
    dps:
      - id: 127
        type: boolean
        name: switch
  - entity: sensor
    class: temperature
    dps:
      - id: 128
        type: integer
        name: sensor
        unit: C

  - entity: sensor
    name: Fan speed
    icon: mdi:fan
    dps:
      - id: 129
        type: integer
        name: sensor
        unit: "%"

  - entity: text
    name: Model
    icon: mdi:information
    category: diagnostic
    dps:
      - id: 130
        type: string
        hidden: false
        name: model

  - entity: text
    name: Hardware version
    icon: mdi:chip
    category: diagnostic
    dps:
      - id: 131
        type: string
        hidden: false
        name: hardware_version

  - entity: text
    name: Software version
    icon: mdi:software-control
    category: diagnostic
    dps:
      - id: 132
        type: string
        hidden: false
        name: software_version

  - entity: binary_sensor
    name: Error code
    class: problem
    category: diagnostic
    dps:
      - id: 133
        type: string
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true

  # Alternator (Car Charging)
  - entity: switch
    name: Alternator charging
    icon: mdi:car-battery
    dps:
      - id: 101
        type: boolean
        name: switch

  - entity: select
    name: Alternator mode
    icon: mdi:cog
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: "ALT_CHG"
            value: "Alternator charge"
          - dps_val: "CHG_CAR_BAT"
            value: "Charge car battery"
          - dps_val: "ACT_CAR_BAT"
            value: "Activate car battery"

  - entity: number
    name: Alternator max charge power
    icon: mdi:lightning-bolt
    dps:
      - id: 103
        type: integer
        name: value
        unit: W
        mapping:
          - step: 100
        range:
          min: 100
          max: 1000

  - entity: number
    name: Alternator max charge current
    icon: mdi:current-dc
    dps:
      - id: 104
        type: integer
        name: value
        unit: A
        mapping:
          - step: 10
        range:
          min: 10
          max: 70

  - entity: sensor
    name: Alternator port voltage
    icon: mdi:sine-wave
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: V
        range:
          min: 0
          max: 600
        mapping:
          - scale: 10

  - entity: sensor
    name: Alternator power
    class: power
    icon: mdi:lightning-bolt
    dps:
      - id: 106
        type: integer
        name: sensor
        unit: W

  - entity: switch
    name: Alternator status check
    icon: mdi:check-circle
    category: config
    dps:
      - id: 134
        type: boolean
        name: switch

  - entity: number
    name: Car charging start voltage
    class: voltage
    icon: mdi:sine-wave
    category: config
    dps:
      - id: 135
        type: integer
        name: value
        unit: V
        mapping:
          - scale: 10
            step: 1
        range:
          min: 125
          max: 280

  # PV (Solar)
  - entity: switch
    name: PV port
    icon: mdi:solar-panel
    dps:
      - id: 107
        type: boolean
        name: switch

  - entity: select
    name: PV mode
    icon: mdi:solar-power
    dps:
      - id: 108
        type: string
        name: option
        mapping:
          - dps_val: PV_CHG
            value: Solar charging
          - dps_val: DC_OUT
            value: DC output

  - entity: select
    name: PV reverse DC output voltage
    icon: mdi:flash-outline
    dps:
      - id: 109
        type: string
        name: option
        mapping:
          - dps_val: 12V
            value: 12V
          - dps_val: 24V
            value: 24V
          - dps_val: 36V
            value: 36V
          - dps_val: 48V
            value: 48V

  - entity: number
    name: PV output current
    icon: mdi:current-dc
    dps:
      - id: 110
        type: integer
        name: value
        unit: A
        mapping:
          - step: 1
        range:
          min: 5
          max: 20

  - entity: sensor
    name: PV voltage
    class: voltage
    icon: mdi:sine-wave
    dps:
      - id: 111
        type: integer
        name: sensor
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: PV power
    class: power
    icon: mdi:lightning-bolt
    dps:
      - id: 112
        type: integer
        name: sensor
        unit: W

  # Etaker proprietary port (connects to other etaker products)
  - entity: switch
    name: Etaker port
    icon: mdi:connection
    dps:
      - id: 113
        type: boolean
        name: switch

  - entity: sensor
    name: Etaker port voltage
    class: voltage
    icon: mdi:sine-wave
    dps:
      - id: 114
        type: integer
        name: sensor
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: Etaker port power
    class: power
    icon: mdi:lightning-bolt
    dps:
      - id: 115
        type: integer
        name: sensor
        unit: W

  # DC Port
  - entity: switch
    name: DC port
    icon: mdi:power-plug
    dps:
      - id: 116
        type: boolean
        name: switch

  - entity: select
    name: DC mode
    icon: mdi:cog-transfer
    dps:
      - id: 117
        type: string
        name: option
        mapping:
          - dps_val: CHG_POWER
            value: Charge power
          - dps_val: CHG_BAT
            value: Charge battery
          - dps_val: DC_OUT
            value: DC output

  - entity: select
    name: DC output voltage
    icon: mdi:flash-outline
    dps:
      - id: 118
        type: string
        name: option
        mapping:
          - dps_val: 12V
            value: 12V
          - dps_val: 24V
            value: 24V
          - dps_val: 36V
            value: 36V
          - dps_val: 48V
            value: 48V

  - entity: number
    name: DC output overcurrent protection
    icon: mdi:shield-alert
    category: config
    dps:
      - id: 119
        type: integer
        name: value
        unit: A
        mapping:
          - step: 1
        range:
          min: 5
          max: 40

  - entity: number
    name: DC charge battery voltage
    class: voltage
    icon: mdi:sine-wave
    category: config
    dps:
      - id: 120
        type: integer
        name: value
        unit: V
        mapping:
          - scale: 10
            step: 5
        range:
          min: 120
          max: 600

  - entity: number
    name: DC charge current
    icon: mdi:current-dc
    category: config
    dps:
      - id: 121
        type: integer
        name: value
        unit: A
        mapping:
          - scale: 10
            step: 10
        range:
          min: 30
          max: 600

  - entity: number
    name: DC precharge voltage
    class: voltage
    icon: mdi:sine-wave
    category: config
    dps:
      - id: 122
        type: integer
        name: value
        unit: V
        mapping:
          - scale: 10
            step: 5
        range:
          min: 120
          max: 600

  - entity: number
    name: DC precharge current
    icon: mdi:current-dc
    category: config
    dps:
      - id: 123
        type: integer
        name: value
        unit: A
        mapping:
          - scale: 10
            step: 5
        range:
          min: 5
          max: 100

  - entity: select
    name: DC charge power source voltage
    icon: mdi:sine-wave
    category: config
    dps:
      - id: 124
        type: string
        name: option
        mapping:
          - dps_val: 24V
            value: 24V
          - dps_val: 48V
            value: 48V

  - entity: sensor
    name: DC port voltage
    class: voltage
    icon: mdi:sine-wave
    dps:
      - id: 125
        type: integer
        name: sensor
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: DC port power
    class: power
    icon: mdi:lightning-bolt
    dps:
      - id: 126
        type: integer
        name: sensor
        unit: W
